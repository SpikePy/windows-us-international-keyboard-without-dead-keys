name: Build

on:
  push:
    paths:
      - "*.go"
      - "go.mod"
      - "*.syso"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Pure Go, no cgo - cross-compiles to Windows trivially, so the build
    # itself just needs a Go toolchain. Running inside the official Alpine
    # based golang image rather than installing Go on the runner directly.
    runs-on: ubuntu-latest
    container: golang:1.24-alpine
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -buildvcs=false -ldflags="-H=windowsgui" -o windows-us-international-keyboard-without-dead-keys.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-us-international-keyboard-without-dead-keys
          path: windows-us-international-keyboard-without-dead-keys.exe
