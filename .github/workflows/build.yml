name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        # -unsafeptr=false: this program's unsafe.Pointer conversions of
        # addresses supplied by Win32 (hook callback parameters,
        # CreateDIBSection's output buffer) are outside anything the Go
        # object graph tracks, which is inherent to raw Win32 interop, not
        # a bug - vet's static heuristic can't tell that apart from a real
        # misuse.
        run: go vet -unsafeptr=false ./...
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Build UndeadKeys.exe
        run: go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ github.ref_name }}" -o UndeadKeys.exe ./cmd/undeadkeys
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Build Setup_UndeadKeys.exe
        run: go build -trimpath -ldflags "-s -w" -o Setup_UndeadKeys.exe ./cmd/undeadkeys-setup
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UndeadKeys-exe
          path: |
            UndeadKeys.exe
            Setup_UndeadKeys.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            UndeadKeys.exe
            Setup_UndeadKeys.exe
          generate_release_notes: true
