name: Build US-AltGr-International keyboard layout

on:
  push:
    paths:
      - "US-AltGr-International.klc"
      - "kbd.h"
      - "kbdusaltgr.rc"
      - "tools/klc2c/**"
      - ".github/workflows/build-keyboard-layout.yml"
  workflow_dispatch: {}

jobs:
  build:
    # kbdutool.exe (MSKLC's ~2007-era 32-bit compiler) crashes with
    # STATUS_STACK_BUFFER_OVERRUN on GitHub's current hosted Windows runner
    # images, regardless of .klc content - confirmed via runner-image-version
    # comparison to be an environment regression, not a content issue. We
    # bypass it (and MSKLC's installer download) entirely: tools/klc2c is a
    # small Go program that generates the keyboard layout DLL's C source
    # (grounded in Microsoft's own kbdus.c reference sample) directly from
    # the .klc, and kbd.h is a minimal, self-authored header with just the
    # KBDTABLES-family definitions it needs. Both get compiled with
    # cl.exe/link.exe.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build klc2c
        shell: pwsh
        working-directory: tools/klc2c
        run: go build -o ../../klc2c.exe .

      - name: Generate kbdusaltgr.c from the .klc
        shell: pwsh
        run: .\klc2c.exe -in US-AltGr-International.klc -out kbdusaltgr.c -def kbdusaltgr.def

      - name: Set up MSVC (amd64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Compile amd64 (x64) layout DLL
        shell: cmd
        run: |
          mkdir build_amd64
          rc.exe /nologo /fo build_amd64\kbdusaltgr.res kbdusaltgr.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /LD /Fe:build_amd64\kbdusaltgr.dll kbdusaltgr.c build_amd64\kbdusaltgr.res kbdusaltgr.def
          if errorlevel 1 exit /b 1
          if not exist build_amd64\kbdusaltgr.dll exit /b 1

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile x86 layout DLL
        shell: cmd
        run: |
          mkdir build_x86
          rc.exe /nologo /fo build_x86\kbdusaltgr.res kbdusaltgr.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /LD /Fe:build_x86\kbdusaltgr.dll kbdusaltgr.c build_x86\kbdusaltgr.res kbdusaltgr.def
          if errorlevel 1 exit /b 1
          if not exist build_x86\kbdusaltgr.dll exit /b 1

      - name: Package installable layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null

          Copy-Item build_amd64\kbdusaltgr.dll "package\kbdusaltgr.dll"
          Copy-Item build_x86\kbdusaltgr.dll "package\x86_kbdusaltgr.dll"
          Set-Content -Path "package\dllname.txt" -Value "kbdusaltgr.dll" -Encoding ascii

          Copy-Item install-layout.ps1 package\
          Copy-Item uninstall-layout.ps1 package\
          Copy-Item kbdusaltgr.c package\
          Copy-Item US-AltGr-International.klc package\ -ErrorAction SilentlyContinue

          Write-Host "---- Package contents ----"
          Get-ChildItem package | Select-Object -ExpandProperty FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: US-AltGr-International-keyboard-layout
          path: package/
