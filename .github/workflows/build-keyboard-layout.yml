name: Build US-AltGr-International keyboard layout

on:
  push:
    paths:
      - "US-AltGr-International.klc"
      - "dll/**"
      - "tools/klc2c/**"
      - ".github/workflows/build-keyboard-layout.yml"
  workflow_dispatch: {}

jobs:
  build:
    # Cross-compiled entirely on Linux with mingw-w64 - no Windows runner,
    # no MSVC, no MSKLC/kbdutool.exe (which crashes unreliably on GitHub's
    # hosted Windows runner images - a confirmed environment regression,
    # not a content issue). tools/klc2c is a small Go program that
    # generates the keyboard layout DLL's C source (grounded in Microsoft's
    # own kbdus.c reference sample) directly from the .klc, into dll/,
    # where kbd.h (a minimal, self-authored header with just the
    # KBDTABLES-family definitions it needs) and kbdusaltgr.rc already
    # live. mingw-w64's gcc/windres compile that into real Windows PE DLLs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build klc2c
        working-directory: tools/klc2c
        run: go build -o ../../klc2c .

      - name: Generate kbdusaltgr.c from the .klc
        run: ./klc2c -in US-AltGr-International.klc -out dll/kbdusaltgr.c -def dll/kbdusaltgr.def

      - name: Compile amd64 (x64) layout DLL
        working-directory: dll
        run: |
          mkdir -p ../build_amd64
          x86_64-w64-mingw32-windres kbdusaltgr.rc ../build_amd64/kbdusaltgr.res.o
          x86_64-w64-mingw32-gcc -shared -o ../build_amd64/kbdusaltgr.dll \
            kbdusaltgr.c ../build_amd64/kbdusaltgr.res.o kbdusaltgr.def -Wl,--kill-at
          test -f ../build_amd64/kbdusaltgr.dll

      - name: Compile x86 layout DLL
        working-directory: dll
        run: |
          mkdir -p ../build_x86
          i686-w64-mingw32-windres kbdusaltgr.rc ../build_x86/kbdusaltgr.res.o
          i686-w64-mingw32-gcc -shared -o ../build_x86/kbdusaltgr.dll \
            kbdusaltgr.c ../build_x86/kbdusaltgr.res.o kbdusaltgr.def -Wl,--kill-at
          test -f ../build_x86/kbdusaltgr.dll

      - name: Package installable layout
        run: |
          mkdir -p package
          cp build_amd64/kbdusaltgr.dll package/kbdusaltgr.dll
          cp build_x86/kbdusaltgr.dll package/x86_kbdusaltgr.dll
          printf 'kbdusaltgr.dll' > package/dllname.txt
          cp install-layout.ps1 uninstall-layout.ps1 package/
          cp dll/kbdusaltgr.c package/
          cp US-AltGr-International.klc package/

          echo "---- Package contents ----"
          ls -la package/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: US-AltGr-International-keyboard-layout
          path: package/
